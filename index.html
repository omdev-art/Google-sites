<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Follower Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Dark Card Container */
    .card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 28px 36px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 260px;
      position: relative;
    }

    .label {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .count {
      font-size: 48px;
      font-weight: 800;
      color: #ffffff;
      margin: 12px 0 20px 0;
      text-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
    }

    /* Purple-Blue Blend Button */
    .follow-btn {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .follow-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
      filter: brightness(1.1);
    }

    .follow-btn:active {
      transform: scale(0.95);
    }

    /* Pop-up Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px 28px;
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #ffffff;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-box h3 {
      margin-bottom: 8px;
      color: #a855f7;
      font-size: 20px;
    }

    .modal-box p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .close-btn {
      background: #334155;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="label">Followers</div>
    <div class="count" id="followerCount">4078</div>
    <button class="follow-btn" id="followBtn">Follow</button>
  </div>

  <!-- Pop-up Modal -->
  <div class="modal-overlay" id="popupModal">
    <div class="modal-box">
      <h3>🎉 Thank You!</h3>
      <p>You are now following!</p>
      <button class="close-btn" id="closeBtn">Close</button>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBKU1osXWvq1RhR2UuFJjrHnt5CGuEf-tc",
      authDomain: "sites-live-counter.firebaseapp.com",
      databaseURL: "https://sites-live-counter-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sites-live-counter",
      storageBucket: "sites-live-counter.firebasestorage.app",
      messagingSenderId: "1071828070465",
      appId: "1:1071828070465:web:f9eadfd3580ebf48df96c0",
      measurementId: "G-7CBDZX4WCD"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const counterRef = ref(db, 'followers');

    const countElement = document.getElementById('followerCount');
    const followBtn = document.getElementById('followBtn');
    const popupModal = document.getElementById('popupModal');
    const closeBtn = document.getElementById('closeBtn');

    // Real-time listener to sync live counts across all active users
    onValue(counterRef, (snapshot) => {
      const val = snapshot.val();
      countElement.innerText = val !== null ? val : 4078;
    });

    // Atomic transaction to increment follower count safely
    followBtn.addEventListener('click', () => {
      runTransaction(counterRef, (currentCount) => {
        return (currentCount || 4078) + 1;
      });

      // Show Pop-up Modal
      popupModal.classList.add('active');
    });

    // Close Pop-up
    closeBtn.addEventListener('click', () => {
      popupModal.classList.remove('active');
    });

    // Close Modal on clicking outside the box
    popupModal.addEventListener('click', (e) => {
      if (e.target === popupModal) {
        popupModal.classList.remove('active');
      }
    });
  </script>
</body>
</html>
